stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

build-image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main
    - master

deploy-to-vps:
  stage: deploy
  image: alpine:latest
  before_script:
    - command -v ssh-agent >/dev/null || ( apk add --update openssh-client )
    - eval $(ssh-agent -s)
    - echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $VPS_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh $VPS_USERNAME@$VPS_HOST "mkdir -p /var/www/svsresult"
    - scp docker-compose.yaml $VPS_USERNAME@$VPS_HOST:/var/www/svsresult/docker-compose.yaml
    - |
      ssh $VPS_USERNAME@$VPS_HOST "cat > /var/www/svsresult/.env << 'ENVEOF'
      DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      NEXTAUTH_URL=${NEXTAUTH_URL}
      AUTH_URL=${AUTH_URL}
      AUTH_SECRET=${NEXTAUTH_SECRET}
      EXTERNAL_API_URL=${EXTERNAL_API_URL}
      EXTERNAL_API_KEY=${EXTERNAL_API_KEY}
      CRON_SECRET=${CRON_SECRET}
      SYNC_SERVICE_SECRET=${SYNC_SERVICE_SECRET}
      AUTO_SYNC_ENABLED=${AUTO_SYNC_ENABLED:-false}
      AUTO_SYNC_INTERVAL_MINUTES=${AUTO_SYNC_INTERVAL_MINUTES:-30}
      SMTP_USER=${SMTP_USER}
      SMTP_PASS=${SMTP_PASS}
      POSTGRES_USER=${POSTGRES_USER}
      POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      POSTGRES_DB=${POSTGRES_DB}
      R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      R2_BUCKET=${R2_BUCKET}
      POSTGRES_SERVICE=${POSTGRES_SERVICE}
      APP_SERVICE=${APP_SERVICE}
      ENVEOF"
    - >
      ssh $VPS_USERNAME@$VPS_HOST "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        cd /var/www/svsresult &&
        IMAGE_NAME=$CI_REGISTRY_IMAGE:latest docker compose pull &&
        IMAGE_NAME=$CI_REGISTRY_IMAGE:latest docker compose up -d
      "
  only:
    - main
    - master

run-migrations:
  stage: deploy
  image: alpine:latest
  when: manual
  before_script:
    - command -v ssh-agent >/dev/null || ( apk add --update openssh-client )
    - eval $(ssh-agent -s)
    - echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $VPS_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh $VPS_USERNAME@$VPS_HOST "cd /var/www/svsresult && docker compose exec -T web-service npx prisma migrate deploy"
  only:
    - main
    - master
