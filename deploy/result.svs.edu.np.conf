# /etc/nginx/sites-available/result.svskirtipur.edu.np
#
# sudo ln -s /etc/nginx/sites-available/result.svskirtipur.edu.np /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
#
# SSL via Let's Encrypt:
#   sudo certbot --nginx -d result.svskirtipur.edu.np

server {
    listen 80;
    listen [::]:80;
    server_name result.svskirtipur.edu.np;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name result.svskirtipur.edu.np;

    # SSL — managed by certbot after first run
    ssl_certificate     /etc/letsencrypt/live/result.svskirtipur.edu.np/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/result.svskirtipur.edu.np/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Proxy to Next.js container (host port 7003 → container port 3000)
    location / {
        proxy_pass http://127.0.0.1:7003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    # Static assets — long cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:7003;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Logs
    access_log /var/log/nginx/result.svskirtipur.edu.np.access.log;
    error_log  /var/log/nginx/result.svskirtipur.edu.np.error.log warn;
}
